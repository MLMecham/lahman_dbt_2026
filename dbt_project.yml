name: "lahman"
version: "1.0.0"
config-version: 2

profile: "rabbit_lahman" # match this in profiles.yml

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  lahman:
    +database: SNOWBEARAIR_DB
    +schema: raw
    +quote_columns: true

models:
  lahman:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
