version: 2

sources:
  - name: lahman
    database: SNOWBEARAIR_DB
    schema: PUBLIC_raw
    tables:
      - name: people
        description: Player biographical and biometric information
      - name: batting
        description: Batting statistics by player, year, team, and stint
      - name: pitching
        description: Pitching statistics by player, year, team, and stint
      - name: fielding
        description: Fielding statistics by player, year, team, stint, and position
      - name: fielding_of
        description: Outfield position breakdown (LF/CF/RF) for fielding records
      - name: fielding_of_split
        description: Split outfield position breakdown for fielding records
      - name: fielding_post
        description: Postseason fielding statistics
      - name: appearances
        description: Number of games played by position, by player, year, and team
      - name: teams
        description: Team standings and season-level stats by year
      - name: teams_franchises
        description: Franchise lookup mapping team IDs to franchise IDs and names
      - name: teams_half
        description: Team standings split by first/second half of season
      - name: managers
        description: Manager records by year and team
      - name: managers_half
        description: Manager records split by first/second half of season
      - name: batting_post
        description: Postseason batting statistics
      - name: pitching_post
        description: Postseason pitching statistics
      - name: series_post
        description: Postseason series results
      - name: allstar_full
        description: All-Star game appearances by player and year
      - name: awards_players
        description: Awards won by players
      - name: awards_share_players
        description: Award voting results (e.g. MVP, Cy Young) for players
      - name: awards_managers
        description: Awards won by managers
      - name: awards_share_managers
        description: Award voting results for managers
      - name: hall_of_fame
        description: Hall of Fame voting results by player and year
      - name: college_playing
        description: Mapping of players to the colleges they attended
      - name: schools
        description: College/school lookup with location information
      - name: salaries
        description: Player salaries by year and team
      - name: parks
        description: Ballpark lookup with names and locations
      - name: home_games
        description: Number of home games played by team and ballpark per season
